<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Перевірка запису пропозицій МТІ</title><link rel="stylesheet" href="../public/import-audit.css"><style>body{font:15px Arial,sans-serif;background:#f5f8fc;color:#193654;margin:24px}main{max-width:1100px;margin:auto}button{padding:12px;margin:8px 4px}table{border-collapse:collapse;width:100%;background:white}td,th{padding:12px;text-align:left;border:1px solid #dce5ef}.table-wrap{overflow:auto}.import-report{padding:20px;background:white;border:1px solid #dce5ef;border-radius:12px}</style><main><h1>Запис пропозицій МТІ</h1><p>Тестові позиції. Імітація Icecat та бази даних; реальних записів немає.</p><div id="panel"><div data-mti-results></div></div></main><script type="module">
import {mountMtiOfferImport} from '../public/mti-offer-admin.js';
const make=(sku,key)=>({key,supplierId:key,supplierSku:sku,sku,manufacturerPartNumber:sku,vendor:'Epson',category:'projectors',name:'Проєктор Epson '+sku,issues:[],hasPrice:true,price:12000,supplierPrice:10000,hasStock:true,stock:2,stockDetail:{kind:'exact',quantity:2},reserved:0,sourceRow:5,content:{name:'Проєктор Epson '+sku,specifications:{Гарантія:'24 міс.'}}});
const rows=[make('EXIST','one'),make('NEW','two')],products=[{id:1,sku:'EXIST',brand:'Epson',category:'projectors'}];
const client={auth:{getSession:async()=>({data:{session:{access_token:'synthetic-test'}}})},from(){return {select(){return this},eq(){return this},order(){return this},limit:async()=>({data:[]}),range:async()=>({data:[]})}},rpc:async(name,args)=>({data:{runId:args.p_request,offers:args.p_rows.length,createdDrafts:1,linkedExisting:1,published:0}})};
window.fetch=async(url,options)=>{if(url!=='/api/erc-catalog')throw Error('Fixture network disabled');const product=JSON.parse(options.body).product;return new Response(JSON.stringify({preview:{status:'review',product,icecatId:123,rows:[],descriptionDraft:{available:true,languages:['UK'],translation:{remainingRussian:false},paragraphs:['Проєктор для презентацій.'],bullets:['Чітке зображення'],html:'unused'}}}));};
mountMtiOfferImport(document.querySelector('#panel'),{client,getRows:()=>rows,getCatalog:()=>products,getSourceName:()=>'test.xlsx'});
</script></html>
