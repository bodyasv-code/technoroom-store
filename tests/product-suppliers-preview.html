<!doctype html><html lang="uk"><meta charset="utf-8"><title>Локальна перевірка постачальників</title>
<link rel="stylesheet" href="../public/product-suppliers.css">
<style>body{font:16px Arial;margin:28px;color:#102a45;background:#f5f8fc}nav{display:flex;gap:20px}section{background:white;padding:24px;margin-top:20px;border:1px solid #d7e2ef;border-radius:16px}table{width:100%;margin:20px 0}small{display:block;margin:8px 0}textarea,input,select{padding:10px;border:1px solid #bdcfe2;border-radius:6px}dialog{width:600px;border:1px solid #bdcfe2;border-radius:16px}button{cursor:pointer}</style>
<nav class="admin-nav"><a href="#products">Товари</a></nav><main class="admin-main"><section id="products"><h2>Тестові товари — без підключення до бази</h2><select id="brandFilter"><option>Усі бренди</option></select><table><tbody id="adminProducts"></tbody></table></section><section id="supplierImport"><h2>Тестове джерело</h2><p id="importBlock"></p></section></main>
<dialog id="productDialog"><form id="productForm"><div class="dialog-heading"><h2>Тестовий товар</h2></div><input type="hidden" name="id"><button type="button" id="close">Закрити</button></form></dialog>
<script type="module">
import {mountSupplierAdmin,supplierFilteredProducts} from '../public/product-suppliers-admin.js';
import {supplierImportBlock} from '../public/product-suppliers.js';
const tables={catalog_suppliers:[{code:'ERC',name:'ERC'},{code:'ASBIS',name:'ASBIS'},{code:'THIRD',name:'Третій постачальник'}],product_suppliers:[{product_id:1,supplier:'ERC',supplier_sku:'S'},{product_id:1,supplier:'ASBIS',supplier_sku:'S'}],product_import_exclusions:[{sku:'REMOVED',is_active:true,reason:'Видалено вручну: не відновлювати імпортом'}]},products=[{id:1,name:'Товар з двома постачальниками'},{id:2,name:'Товар без прив’язки'}],registry={ready:false,links:[],exclusions:[]};
const db={from(table){return {select(){return this},order(){return this},range(){return Promise.resolve({data:structuredClone(tables[table])})}}},async rpc(name,args){if(name==='set_product_import_exclusion'){let row=tables.product_import_exclusions.find(x=>x.sku===args.p_sku);if(!row)tables.product_import_exclusions.push(row={sku:args.p_sku});Object.assign(row,{is_active:args.p_active,reason:args.p_reason});}if(name==='set_product_suppliers'){tables.product_suppliers=tables.product_suppliers.filter(x=>x.product_id!==args.p_id);tables.product_suppliers.push(...args.p_suppliers.map(supplier=>({product_id:args.p_id,supplier})));}return {error:null};}};
function render(){const rows=supplierFilteredProducts(products,registry,document.querySelector('#supplierFilter')?.value);document.querySelector('#adminProducts').innerHTML=rows.map(x=>'<tr><td>'+x.id+'</td><td>'+x.name+'</td><td><button data-edit-product="'+x.id+'">Редагувати</button></td></tr>').join('');}
document.addEventListener('click',event=>{const button=event.target.closest('[data-edit-product]');if(button){document.querySelector('#productForm').elements.id.value=button.dataset.editProduct;document.querySelector('#productDialog').showModal();}});document.querySelector('#close').onclick=()=>document.querySelector('#productDialog').close();
mountSupplierAdmin({db,registry,getProducts:()=>products,rerender:render,onRegistry:()=>{document.querySelector('#importBlock').textContent=supplierImportBlock(registry,{sku:'REMOVED',supplier:'ERC'});}});
</script></html>
