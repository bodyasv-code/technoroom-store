<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
<title>Каталог — TECHNOROOM</title>
  <link rel="stylesheet" href="styles.css?v=20260923-header-hotfix2">
  <style>
    .catalog-refine{margin-top:22px;border-top:1px solid var(--line);padding-top:14px}.catalog-refine label{display:block;margin:0 0 12px;font-size:11px;font-weight:800}.catalog-refine input,.catalog-refine select,.sort-label select{box-sizing:border-box;width:100%;margin-top:6px;padding:9px;border:1px solid var(--line);background:#fff;color:var(--ink);font:12px Manrope}.catalog-refine label.check{display:flex;align-items:center;gap:8px}.catalog-refine label.check input{width:auto;margin:0}.filters .clear-filters{padding:8px 0;color:var(--muted);font-size:11px}.sort-label{display:flex;align-items:center;gap:8px;font-weight:700}.sort-label select{width:auto;margin:0}@media(max-width:780px){.catalog-refine{min-width:210px;padding:12px;border:1px solid var(--line);background:#fff}.catalog-toolbar{align-items:flex-start;gap:12px}.sort-label{display:grid;gap:3px}}
  </style>
</head>
<body>
  <div class="home-top shared-store-top"><div class="home-wide"><span>Техніка, що створює можливості</span><nav><span>⌖ Київ</span><span>▣ Доставка і оплата</span><span>♢ Гарантія</span><span>◉ Підтримка</span><span>⌕ Контакти</span></nav></div></div><header class="compact-header store-shared-header"><div class="home-wide header-row"><a class="home-logo" href="index.html"><b>TR</b><span>TECHNO<strong>ROOM</strong><small>НАДІЙНІ РІШЕННЯ СЬОГОДНІ</small></span></a><button class="catalog-menu-toggle" id="catalogMenuToggle" type="button">▦ Каталог⌄</button><div class="header-search"><span>⌕</span><input id="headerCatalogSearch" type="search" placeholder="Я шукаю... (наприклад, проектор, ноутбук, зарядна станція)"><button type="button" id="headerCatalogSearchGo">⌕</button></div><a class="cart-button shared-cart-button" href="checkout.html">🛒 <span>Кошик</span> <b id="cartCount">0</b></a></div><div class="catalog-mega" id="catalogMega" hidden><div class="home-wide catalog-mega-inner"><div class="mega-roots" id="megaRoots"></div><div class="mega-children" id="megaChildren"></div></div></div></header>
  <main class="catalog-page"><div class="container">
    <p class="breadcrumbs"><a href="index.html">Головна</a> / Каталог</p><h1>Каталог техніки</h1>
    <div class="catalog-layout catalog-layout-no-sidebar">
      <aside class="filters filters-only">
        <div class="catalog-refine">
          <label>Пошук<input id="catalogSearch" type="search" placeholder="Назва або бренд"></label>
          <label>Бренд<select id="brandFilter"><option value="">Усі бренди</option></select></label>
          <div class="price-range-label"><strong>Ціна, ₴</strong><div class="price-values"><input id="priceMin" type="number" min="0" value="0"><input id="priceFilter" type="number" min="0"></div><div class="dual-range"><input id="priceMinRange" type="range" min="0" max="100000" value="0" step="100"><input id="priceRange" type="range" min="0" max="100000" value="100000" step="100"></div><span class="price-range-caption" id="priceRangeCaption"></span><div class="price-presets"><button type="button" data-price-max="5000">До 5 000 ₴</button><button type="button" data-price-min="5000" data-price-max="15000">5 000 – 15 000 ₴</button><button type="button" data-price-min="15000" data-price-max="50000">15 000 – 50 000 ₴</button><button type="button" data-price-min="50000">Від 50 000 ₴</button></div></div>
          <label class="check"><input id="stockFilter" type="checkbox"> Лише в наявності</label>
          <button type="button" id="clearCatalogFilters" class="clear-filters">Скинути фільтри</button>
        </div>
      </aside>
      <section><div class="catalog-toolbar"><span id="resultCount"></span><label class="sort-label">Сортування<select id="catalogSort"><option value="popular">Популярні</option><option value="price-asc">Ціна: від нижчої</option><option value="price-desc">Ціна: від вищої</option><option value="name">Назва: А–Я</option></select></label></div><div class="catalog-grid" id="catalogGrid"></div></section>
    </div>
  </div></main>
  <script src="supabase-config.js"></script><script type="module" src="app.js?v=20260923-header-hotfix2"></script>
</body>
</html>
