<!doctype html><html lang="uk"><meta charset="UTF-8"><title>Контент товару — локальна перевірка</title>
<style>body{font:16px/1.5 system-ui;max-width:1120px;margin:24px auto;padding:0 16px;background:#f4f7fb;color:#152a46}section{background:white;padding:24px;border:1px solid #dbe4ef;border-radius:14px}table{border-collapse:collapse;width:100%}th,td{padding:12px;border:1px solid #dbe4ef;text-align:left;vertical-align:top;overflow-wrap:anywhere}button,input{font:inherit;padding:12px;min-height:44px}button{cursor:pointer}button:disabled{cursor:wait}label{display:block}.admin-controls{display:flex;gap:12px;align-items:end;flex-wrap:wrap}small{color:#58708b}button:focus-visible,input:focus-visible{outline:3px solid #1680ed;outline-offset:2px}@media(max-width:600px){.admin-controls{display:block}button,input{box-sizing:border-box;width:100%;margin-top:8px}}</style>
<h1>Перевірка порівняння контенту</h1><p>Локальний тест зі штучними даними. Не звертається до Icecat або бази. Введіть 4331 для перевірки конфлікту й захищеного поля. 159 покаже відмову в доступі.</p><section id="ercCatalogApi"><h2>ERC API</h2></section>
<script type="module">
import {mountProductContentPreview} from '../public/product-content-preview-admin.js';
import {buildContentPreview} from '../public/product-content-preview.js';
const product={id:4331,sku:'6928C001',brand:'Canon',name:'Тестовий Canon — дані не для імпорту',category:'office-mfp-color',specifications:{'Двосторонній друк':'Ручний','Wi-Fi':'Так'},manual_overrides:{specifications:{'Двосторонній друк':true}}};
const fixture={data:{DemoAccount:false,GeneralInfo:{Brand:'Canon',BrandPartCode:'6928C001'},FeaturesGroups:[{FeatureGroup:{Name:{Value:'Друк'}},Features:[{Feature:{ID:1,Name:{Value:'Duplex printing mode',Language:'EN'}},PresentationValue:'Auto'},{Feature:{ID:2,Name:{Value:'Wi-Fi',Language:'UK'}},PresentationValue:'Ні'}]}]}};
window.fetch=async(url,options)=>{if(url!=='/api/erc-catalog')throw new Error('External request blocked in fixture');const body=JSON.parse(options.body);if(body.action==='content-status')return new Response(JSON.stringify({configured:false}),{status:200});if(body.productId===159)return new Response(JSON.stringify({error:'Тестова відмова: доступ до контенту обмежено.'}),{status:502});return new Response(JSON.stringify({preview:buildContentPreview(product,fixture)}),{status:200});};
mountProductContentPreview({client:{auth:{getSession:async()=>({data:{session:{access_token:'local-fixture'}}})}}});
</script></html>
