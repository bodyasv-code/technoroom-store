<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Перевірка пакетного контенту</title><link rel="stylesheet" href="../public/import-audit.css"><style>body{font:16px Arial;background:#f5f8fc;color:#193654;margin:24px}button{padding:12px}dialog{max-width:900px;width:85%}.import-report{padding:18px;border:1px solid #dce5ef;margin:10px 0}dt{font-weight:bold}pre{background:#f5f8fc;padding:12px}</style><h1>Тест пакетного контенту</h1><p>Імітація двох товарів, Icecat і бази. Реальні записи та мережеві запити вимкнено.</p><button id="fillSelectedProductContent">Заповнити контент для вибраних</button><p id="saved">Записів немає</p><script type="module">
import {mountBulkProductContent} from '../public/bulk-product-content-admin.js';
const products=[{id:1,name:'Проєктор Epson TEST',sku:'TEST',brand:'Epson',category:'projectors',description:null,specifications:{Гарантія:'24 міс.'},manual_overrides:{},is_active:false},{id:2,name:'Екран TEST',sku:'SCREEN',brand:'Test',category:'erc-display-06',description:null,specifications:{},manual_overrides:{},is_active:false}];
const client={auth:{getSession:async()=>({data:{session:{access_token:'synthetic-only'}}})},from(){let id;return{select(){return this},eq(key,value){id=value;return this},in:async()=>({data:structuredClone(products)}),maybeSingle:async()=>({data:structuredClone(products.find(p=>p.id===id))})}},rpc:async(name,args)=>name==='start_product_import'?{data:'test-run'}:name==='finish_product_import'?{data:{}}:{data:{id:args.p_id,unchanged:false}}};
window.fetch=async(url,options)=>{if(url!=='/api/erc-catalog')throw Error('Network disabled');const id=JSON.parse(options.body).productId;return new Response(JSON.stringify({preview:id===2?{status:'unavailable'}:{status:'review',product:products[0],icecatId:12,descriptionDraft:{available:true,languages:['UK'],translation:{remainingRussian:false},paragraphs:['Проєктор для навчання та презентацій.'],bullets:['Чітке зображення']},rows:[{status:'new',mapping:'feature-id',language:'UK',canonical:'Яскравість',value:'3000 лм',reasons:[]}]}}));};
mountBulkProductContent({client,getSelectedIds:()=>new Set([1,2]),onSaved:async()=>{document.querySelector('#saved').textContent='Тестове збереження виконано';}});
</script></html>
